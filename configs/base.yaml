# Everything that is FIXED across all 8 runs.
# Factor-varying values live in factors.yaml; corpus definition in corpus.yaml.
# Nothing in this file may be overridden anywhere except by a factor level.
schema_version: 1
seed: 20260813

chunking:
  # strategy is supplied by the factor level
  # 510, not 512, and the two are the same number wearing different clothes.
  # embedding.max_seq_tokens is the encoder's position limit and INCLUDES [CLS]
  # and [SEP]; this target is expressed in content tokens. At 512 the two
  # disagreed by exactly the two special tokens, and 93.3% of the fixed arm's
  # chunks lost their tail at embedding time while only 1.9% of the recursive
  # arm's did -- an arm-asymmetric defect produced by an off-by-two.
  target_tokens: 510
  overlap_tokens: 0
  # Canonical chunk tokenizer, used for BOTH embedding arms so that chunking is
  # embedder-independent. This is what makes the design a clean factorial: two
  # chunk sets, not four. Do not point this at the embedding model.
  tokenizer_id: BAAI/bge-base-en-v1.5
  # A Hub id is a mutable pointer; the revision is the reproducible thing.
  # Chunk boundaries are a function of how this tokenizer segments text, so an
  # unpinned id would let the corpus re-chunk itself between this laptop and
  # Kaggle without anything in the config changing.
  tokenizer_revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  min_chunk_tokens: 0        # 0 = keep tail chunks and report the distribution honestly
  separators: ["\n\n", "\n", ". ", " ", ""]

  # Abstracts are parsed and kept (corpus.keep_abstract) but are NOT chunked,
  # so they are not retrievable. Three reasons, in order of how much they matter:
  #
  #  1. An abstract restates its own body. Chunking both puts two correct
  #     passages in the index for one gold span, so a retrieval hit on the
  #     abstract scores as a miss against a body-span label -- the metric would
  #     be measuring a labelling artefact rather than retrieval quality.
  #  2. Abstract-level retrieval is precisely what specter2 was trained on
  #     (citation proximity over titles + abstracts). Indexing abstracts would
  #     hand one embedding arm a home-field advantage that has nothing to do
  #     with the question this experiment asks.
  #  3. Gold spans are character offsets into ParsedPaper.body. An abstract is
  #     not in that stream, so a chunk drawn from one has no offset to overlap.
  #
  # Only `false` is implemented; the key exists to state the decision and to
  # pin it into the chunk-set cache key.
  chunk_abstract: false

embedding:
  # name / model_id / model_revision / adapter_id / adapter_revision /
  # query_instruction come from the factor level.
  normalize: true
  # Both arms are BERT-based and take the [CLS] token as the sequence
  # representation. Fixed across all 8 runs: pooling is not a factor, and a
  # difference in pooling between the arms would be an uncontrolled variable
  # wearing the embedding factor's name.
  pooling: cls
  # The model's own position-embedding limit, INCLUDING [CLS] and [SEP]. A chunk
  # of more than max_seq_tokens - 2 content tokens loses its tail at embedding
  # time; the index stage counts those and refuses to be quiet about it.
  max_seq_tokens: 512
  batch_size: 32

rerank:
  # enabled comes from the factor level
  model_id: BAAI/bge-reranker-base
  model_revision: 2cfc18c9415c912f9d8155881c133215df768a70
  max_seq_tokens: 512
  batch_size: 16

retrieval:
  depth: 30                       # dense candidates pulled from Chroma before reranking
  context_token_budget: 2000      # THE controlled variable: constant tokens, not constant k
  budget_tokenizer_id: Qwen/Qwen2.5-7B-Instruct   # budget is measured in generator tokens
  budget_tokenizer_revision: a09a35458c702b33eeacc393d103063234e8bc28
  fill_policy: stop_at_overflow   # never truncate a chunk; stop at the first that will not fit

generation:
  # The AWQ repo, NOT the bf16 one. Qwen publishes the quantised checkpoint as a
  # separate repo, and `quantization: awq` is a statement about which weights are
  # loaded, not an instruction to quantise on the fly.
  model_id: Qwen/Qwen2.5-7B-Instruct-AWQ
  model_revision: b25037543e9394b818fdfca67ab2a00ecc7dd641
  quantization: awq               # fits a free-tier T4; null for full precision
  # float16, not auto: a free-tier T4 is Turing and has no bfloat16, so `auto`
  # resolves differently there than on an Ampere host. Numerics that follow the
  # GPU are an uncontrolled variable, and this is the one value both can run.
  dtype: float16
  # retrieval.budget_tokenizer_id still points at Qwen/Qwen2.5-7B-Instruct, and
  # that is correct rather than an oversight: the two repos ship byte-identical
  # tokenizer.json, tokenizer_config.json, vocab.json and merges.txt (checked by
  # git blob oid), so the budget is measured with the tokenizer this model
  # actually uses. Quantisation changes weights, not vocabulary.

  # ---- decoding. Greedy, and every field is stated rather than defaulted.
  #
  # Both Qwen repos ship a generation_config.json carrying do_sample: true,
  # temperature 0.7, top_p 0.8, top_k 20, repetition_penalty 1.05, and vLLM
  # reads that file. A request that sets only `temperature: 0` would inherit
  # top_k and repetition_penalty from the checkpoint -- decoding would not be
  # greedy, nothing would say so, and the run would still be labelled
  # temperature 0. So the neutral value of every sampling field is pinned here
  # and passed explicitly on every request.
  temperature: 0.0
  top_p: 1.0
  top_k: -1                       # -1 = disabled. The checkpoint's default is 20.
  repetition_penalty: 1.0         # 1.0 = none. The checkpoint's default is 1.05.
  max_new_tokens: 512
  seed: 20260813
  # Context budget (2000) + prompt scaffolding + max_new_tokens, rounded up. It
  # bounds the KV cache, which is what makes a 7B model fit a 16 GB T4 -- and it
  # can truncate, so it is config (part of the run id) rather than a CLI knob.
  max_model_len: 4096

  # ---- the prompt. Its TEXT lives here, not in code, so that changing a word
  # changes the resolved config and therefore the run id: answers produced under
  # two different prompts can never land in one run directory.
  prompt_template_id: v1
  # Said once, in the system turn. No chain of thought, no citations, no
  # formatting instructions -- each of those changes what the judge is scoring
  # from "is this answer right" to "did it comply with the format".
  system_prompt: |-
    You are answering questions about biomedical research papers.

    Answer using only the passages provided. Do not use prior knowledge, and do
    not infer beyond what the passages state. If the passages do not contain the
    answer, reply with exactly this sentence and nothing else:

    The provided context does not contain the answer.

    Answer in one to three sentences.
  prompt_template: |-
    Passages:

    {context}

    Question: {question}
  # Fixed refusal wording, quoted verbatim in the system prompt above. Having one
  # exact string makes abstentions countable instead of a judgement call over
  # paraphrases -- a configuration that abstains often is a retrieval finding,
  # and it must not be confused with one that answers badly.
  refusal_text: The provided context does not contain the answer.
  # Between passages. A blank line, because anything more (numbering, rules,
  # source labels) is a citation scaffold the generator would learn to imitate.
  context_separator: "\n\n"

judge:
  provider: openrouter
  # Pin an exact id. Free-tier model slugs rotate, and the judge identity must be
  # recorded with the results.
  model_id: meta-llama/llama-3.3-70b-instruct
  temperature: 0.0
  rubric_id: v1
  max_retries: 5
  requests_per_minute: 20
