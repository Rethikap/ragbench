# Everything that is FIXED across all 8 runs.
# Factor-varying values live in factors.yaml; corpus definition in corpus.yaml.
# Nothing in this file may be overridden anywhere except by a factor level.
schema_version: 1
seed: 20260813

chunking:
  # strategy is supplied by the factor level
  # 510, not 512, and the two are the same number wearing different clothes.
  # embedding.max_seq_tokens is the encoder's position limit and INCLUDES [CLS]
  # and [SEP]; this target is expressed in content tokens. At 512 the two
  # disagreed by exactly the two special tokens, and 93.3% of the fixed arm's
  # chunks lost their tail at embedding time while only 1.9% of the recursive
  # arm's did -- an arm-asymmetric defect produced by an off-by-two.
  target_tokens: 510
  overlap_tokens: 0
  # Canonical chunk tokenizer, used for BOTH embedding arms so that chunking is
  # embedder-independent. This is what makes the design a clean factorial: two
  # chunk sets, not four. Do not point this at the embedding model.
  tokenizer_id: BAAI/bge-base-en-v1.5
  # A Hub id is a mutable pointer; the revision is the reproducible thing.
  # Chunk boundaries are a function of how this tokenizer segments text, so an
  # unpinned id would let the corpus re-chunk itself between this laptop and
  # Kaggle without anything in the config changing.
  tokenizer_revision: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a
  min_chunk_tokens: 0        # 0 = keep tail chunks and report the distribution honestly
  separators: ["\n\n", "\n", ". ", " ", ""]

  # Abstracts are parsed and kept (corpus.keep_abstract) but are NOT chunked,
  # so they are not retrievable. Three reasons, in order of how much they matter:
  #
  #  1. An abstract restates its own body. Chunking both puts two correct
  #     passages in the index for one gold span, so a retrieval hit on the
  #     abstract scores as a miss against a body-span label -- the metric would
  #     be measuring a labelling artefact rather than retrieval quality.
  #  2. Abstract-level retrieval is precisely what specter2 was trained on
  #     (citation proximity over titles + abstracts). Indexing abstracts would
  #     hand one embedding arm a home-field advantage that has nothing to do
  #     with the question this experiment asks.
  #  3. Gold spans are character offsets into ParsedPaper.body. An abstract is
  #     not in that stream, so a chunk drawn from one has no offset to overlap.
  #
  # Only `false` is implemented; the key exists to state the decision and to
  # pin it into the chunk-set cache key.
  chunk_abstract: false

embedding:
  # name / model_id / model_revision / adapter_id / adapter_revision /
  # query_instruction come from the factor level.
  normalize: true
  # Both arms are BERT-based and take the [CLS] token as the sequence
  # representation. Fixed across all 8 runs: pooling is not a factor, and a
  # difference in pooling between the arms would be an uncontrolled variable
  # wearing the embedding factor's name.
  pooling: cls
  # The model's own position-embedding limit, INCLUDING [CLS] and [SEP]. A chunk
  # of more than max_seq_tokens - 2 content tokens loses its tail at embedding
  # time; the index stage counts those and refuses to be quiet about it.
  max_seq_tokens: 512
  batch_size: 32

rerank:
  # enabled comes from the factor level
  model_id: BAAI/bge-reranker-base
  model_revision: 2cfc18c9415c912f9d8155881c133215df768a70
  max_seq_tokens: 512
  batch_size: 16

retrieval:
  depth: 30                       # dense candidates pulled from Chroma before reranking
  context_token_budget: 2000      # THE controlled variable: constant tokens, not constant k
  budget_tokenizer_id: Qwen/Qwen2.5-7B-Instruct   # budget is measured in generator tokens
  budget_tokenizer_revision: a09a35458c702b33eeacc393d103063234e8bc28
  fill_policy: stop_at_overflow   # never truncate a chunk; stop at the first that will not fit

generation:
  # The AWQ repo, NOT the bf16 one. Qwen publishes the quantised checkpoint as a
  # separate repo, and `quantization: awq` is a statement about which weights are
  # loaded, not an instruction to quantise on the fly.
  model_id: Qwen/Qwen2.5-7B-Instruct-AWQ
  model_revision: b25037543e9394b818fdfca67ab2a00ecc7dd641
  quantization: awq               # fits a free-tier T4; null for full precision
  # float16, not auto: a free-tier T4 is Turing and has no bfloat16, so `auto`
  # resolves differently there than on an Ampere host. Numerics that follow the
  # GPU are an uncontrolled variable, and this is the one value both can run.
  dtype: float16
  # retrieval.budget_tokenizer_id still points at Qwen/Qwen2.5-7B-Instruct, and
  # that is correct rather than an oversight: the two repos ship byte-identical
  # tokenizer.json, tokenizer_config.json, vocab.json and merges.txt (checked by
  # git blob oid), so the budget is measured with the tokenizer this model
  # actually uses. Quantisation changes weights, not vocabulary.

  # ---- decoding. Greedy, and every field is stated rather than defaulted.
  #
  # Both Qwen repos ship a generation_config.json carrying do_sample: true,
  # temperature 0.7, top_p 0.8, top_k 20, repetition_penalty 1.05, and vLLM
  # reads that file. A request that sets only `temperature: 0` would inherit
  # top_k and repetition_penalty from the checkpoint -- decoding would not be
  # greedy, nothing would say so, and the run would still be labelled
  # temperature 0. So the neutral value of every sampling field is pinned here
  # and passed explicitly on every request.
  temperature: 0.0
  top_p: 1.0
  top_k: -1                       # -1 = disabled. The checkpoint's default is 20.
  repetition_penalty: 1.0         # 1.0 = none. The checkpoint's default is 1.05.
  max_new_tokens: 512
  seed: 20260813
  # Context budget (2000) + prompt scaffolding + max_new_tokens, rounded up. It
  # bounds the KV cache, which is what makes a 7B model fit a 16 GB T4 -- and it
  # can truncate, so it is config (part of the run id) rather than a CLI knob.
  max_model_len: 4096

  # ---- the prompt. Its TEXT lives here, not in code, so that changing a word
  # changes the resolved config and therefore the run id: answers produced under
  # two different prompts can never land in one run directory.
  prompt_template_id: v1
  # Said once, in the system turn. No chain of thought, no citations, no
  # formatting instructions -- each of those changes what the judge is scoring
  # from "is this answer right" to "did it comply with the format".
  system_prompt: |-
    You are answering questions about biomedical research papers.

    Answer using only the passages provided. Do not use prior knowledge, and do
    not infer beyond what the passages state. If the passages do not contain the
    answer, reply with exactly this sentence and nothing else:

    The provided context does not contain the answer.

    Answer in one to three sentences.
  prompt_template: |-
    Passages:

    {context}

    Question: {question}
  # Fixed refusal wording, quoted verbatim in the system prompt above. Having one
  # exact string makes abstentions countable instead of a judgement call over
  # paraphrases -- a configuration that abstains often is a retrieval finding,
  # and it must not be confused with one that answers badly.
  refusal_text: The provided context does not contain the answer.
  # Between passages. A blank line, because anything more (numbering, rules,
  # source labels) is a citation scaffold the generator would learn to imitate.
  context_separator: "\n\n"

judge:
  # Which hosted judge to use. Both are kept: a reviewer may reasonably ask
  # whether a result depends on the judge provider, and that is only answerable
  # if the alternative is still configured rather than deleted. Switching is a
  # one-word change here, and because the whole resolved config reaches the run
  # id, scores from two judges can never land in one directory.
  #
  # NOT Qwen2.5-7B, under either provider. The generator must never judge its
  # own output: that stacks self-preference bias on top of the small-judge
  # unreliability the LLM-as-judge literature warns about, and the two are not
  # separable after the fact. A different family and a much larger model is the
  # minimum, and a test fails the build if the two ids ever coincide.
  provider: groq
  providers:
    # Free with no card required, which is why it is the default.
    groq:
      # WHY THIS MODEL, and not the one in the proposal. This belongs in the
      # methodology write-up, not only here.
      #
      # The proposal named Llama-3.3-70B as the judge. Groq has since retired
      # llama-3.3-70b-versatile from its free tier, so that model is no longer
      # available to this project at zero cost. Of the chat models the free tier
      # does offer -- openai/gpt-oss-120b, openai/gpt-oss-20b,
      # openai/gpt-oss-safeguard-20b, qwen/qwen3.8-27b, groq/compound,
      # groq/compound-mini, allam-2-7b -- gpt-oss-120b is the largest that is
      # not a Qwen model, and judge capacity is the thing worth maximising.
      #
      # "not a Qwen model" is doing real work in that sentence. The generator is
      # Qwen2.5-7B-Instruct, and I8 forbids the generator's family from grading
      # its own output: self-preference bias on top of small-judge
      # unreliability, and the two are not separable afterwards. qwen3.8-27b
      # sits on the same account's model list, so that rule is a live exclusion
      # here rather than a hypothetical one -- it removed a candidate that was
      # otherwise eligible. The judge-is-not-the-generator test checks the
      # selected provider AND every alternative for exactly this reason.
      #
      # The substitution is a deviation from the proposal, forced by
      # availability rather than chosen, and it should be reported as one:
      # the judge is a 120B open-weights model rather than a 70B Llama.
      model_id: openai/gpt-oss-120b
      endpoint: https://api.groq.com/openai/v1/chat/completions
      # The key itself is never in the repo or in any config. This names the
      # variable to read it from, which is documentation rather than a secret.
      api_key_env: GROQ_API_KEY
      # TOKENS are the binding constraint here, not requests. One judgement
      # carries the retrieved context -- it must, or faithfulness cannot be
      # assessed -- so a call costs about 2,900 tokens.
      #
      #   8,000 tokens/minute / ~2,900 = under THREE calls a minute,
      #                                  against the 30 requests/minute allowed.
      #
      # A client pacing only on requests would spend the day collecting 429s, so
      # the client paces on both. Its pre-call estimate is deliberately more
      # conservative still (~3,250, because it counts the max_tokens ceiling it
      # cannot yet know the model will not use), and is replaced by the usage
      # figure the response reports.
      requests_per_minute: 30
      tokens_per_minute: 8000
      # And the day:
      #
      #   200,000 tokens/day / ~2,900 = about 68 calls,
      #   280 calls / 68 per day      = roughly FOUR DAYS for a full run.
      #
      # That is a schedule rather than a failure: the stage stops cleanly at the
      # cap, keeps everything written, and continues when the same command is
      # re-run after the allowance resets.
      #
      # Set this to what your own console reports. The published figures move,
      # so the client also reads the x-ratelimit-* response headers and prints
      # what the server actually says is left.
      daily_token_cap: 200000
      # Provider-specific request fields, passed through untouched. Empty by
      # default. gpt-oss models emit reasoning tokens before their answer, and
      # those count against max_tokens: if replies start coming back empty and
      # the `unparsed` column climbs, `reasoning_effort: low` here is the lever.
      # Left unset rather than guessed at, because it changes how the judge
      # thinks and that belongs in the run id as a deliberate choice.
      extra_body: {}
    # Kept as the second backend. As of 2026-09 its free variants require a
    # credit balance, which is why it is not the default.
    openrouter:
      model_id: meta-llama/llama-3.3-70b-instruct
      endpoint: https://openrouter.ai/api/v1/chat/completions
      api_key_env: OPENROUTER_API_KEY
      requests_per_minute: 20
      tokens_per_minute: 0        # 0 = unpaced on tokens
      daily_token_cap: 0          # 0 = no cap enforced locally
      # Neither is a credential; OpenRouter uses them to attribute traffic.
      extra_headers:
        HTTP-Referer: https://github.com/ragbench
        X-Title: ragbench
  temperature: 0.0
  seed: 20260813
  max_tokens: 400
  max_retries: 5
  # Ask the provider to constrain the response to a JSON object. Not every
  # provider accepts the parameter, so the client drops it and retries once if
  # it is rejected -- the prompt states the schema regardless.
  require_json_object: true

  # Each answer is scored TWICE, at temperature 0. Run-to-run inconsistency is a
  # standard failure mode for LLM judges, and a judge that disagrees with itself
  # bounds how much any difference between configurations can be trusted. At
  # this scale the second pass costs minutes, so there is no reason to assume
  # the consistency instead of measuring it.
  passes: 2

  rubric_id: v1
  # Three scales AND a categorical verdict, because one scale cannot separate
  # the two failure modes in the generated output. A confident fabrication and a
  # correct abstention would land near each other on any single axis; they are
  # opposite outcomes. The verdict carries the kind of failure, the scales carry
  # the degree.
  scales: [faithfulness, relevance, completeness]
  verdicts: [correct, partially_correct, incorrect, abstained]
  system_prompt: |-
    You are grading answers produced by a retrieval-augmented system over
    biomedical research papers. You are given the question, the reference answer
    written by a human expert, the answer under review, and the retrieved
    passages that were the only material the system was shown.

    Grade strictly and literally. Do not reward fluency, length, or confidence.

    Two distinctions do most of the work here.

    FAITHFULNESS is about the RETRIEVED PASSAGES, not the reference answer. Ask
    whether each claim, as stated, is supported by the passages. A number that
    appears somewhere in the passages but is attached to the wrong entity,
    condition, or timepoint is NOT faithful -- the claim it makes is false even
    though the token is present. Treat a swapped pair of values as a serious
    fault, not a quibble.

    CORRECTNESS is about the REFERENCE ANSWER. An answer can be perfectly
    faithful to the passages and still fail to match the reference, because the
    passages may not contain the answer at all.

    Scoring, 1 to 5 on each scale:

    faithfulness -- is every claim supported by the passages?
      5  every claim is supported by the passages
      4  supported, with a minor unsupported embellishment
      3  mostly supported; one specific detail is not
      2  a central claim is unsupported, or a value is attached to the wrong
         entity
      1  fabricated, or contradicted by the passages

    relevance -- does it answer the question that was asked?
      5  answers exactly what was asked
      4  answers it, with some material that was not asked for
      3  answers part of it, or answers a neighbouring question
      2  largely addresses something else
      1  does not address the question

    completeness -- does it cover what the reference answer covers?
      5  covers every component of the reference
      4  covers the substance; omits a supporting statistic or qualifier
      3  covers one component of a two-component answer
      2  touches the topic but omits the substance
      1  contains none of the reference's content

    verdict -- one of:
      correct            matches the reference in substance. Wording,
                         rounding, and units expressed differently are fine.
      partially_correct  one component right and another wrong or missing --
                         for example the right threshold with the wrong
                         sensitivity.
      incorrect          contradicts the reference, or states a fabricated
                         value with confidence.
      abstained          declines to answer, saying the passages do not
                         contain it.

    An abstention is not a low score. If the passages genuinely do not contain
    the answer, declining is the system behaving correctly, and it is recorded
    separately rather than graded. Use verdict "abstained" and set all three
    scales to null.

    Reply with a single JSON object and nothing else -- no prose before or
    after, no markdown fence:

    {"faithfulness": <1-5 or null>, "relevance": <1-5 or null>,
     "completeness": <1-5 or null>, "verdict": "<one of the four>",
     "rationale": "<one or two sentences, citing what decided it>"}
  prompt_template: |-
    QUESTION:
    {question}

    REFERENCE ANSWER (written by a human expert):
    {reference_answer}

    RETRIEVED PASSAGES (all the system was shown):
    {context}

    ANSWER UNDER REVIEW:
    {answer}
    {judge_note}
    Return the JSON object now.
  # Rendered only for the two gold records that carry a note, and left empty
  # otherwise so no item is prompted with a dangling heading. The notes travel
  # with the gold set rather than beside it, so the rubric cannot drift away
  # from the label it applies to.
  judge_note_template: |-

    SPECIAL INSTRUCTION FOR THIS ITEM, from the person who wrote the reference
    answer. It overrides the general rules above:
    {judge_note}
  # A parse failure gets one corrective retry carrying this reminder, then the
  # item is recorded as unparsed and counted. Silently dropping it would shrink
  # a configuration's denominator without saying so.
  retry_instruction: |-
    Your previous reply was not valid JSON. Reply with the JSON object only:
    no prose, no markdown fence, no trailing text.

  # The blind calibration sheet: how many answers to hand-score, and the seed
  # that picks them. Stratified across configurations, config label hidden.
  calibration_sample: 40
  calibration_seed: 20260813
