[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench"
version = "0.1.0"
description = "Controlled 2x2x2 factorial benchmark of RAG design choices for scientific-literature QA"
# 3.11 locally, 3.12 on Kaggle's GPU sessions. The upper bound is not arbitrary:
# `adapters`, which the specter2 arm needs, publishes no 3.13 classifier, so 3.13
# would take the specter2 arm away. Verified identical cache ids on 3.11.9 and
# 3.12.10 -- see the golden digests in tests/test_cache_keys.py.
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "lxml>=5.0",
    "requests>=2.31",
    "tenacity>=8.2",
    "psutil>=5.9",
    "numpy>=1.26",
    "transformers>=4.40",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
]

[project.optional-dependencies]
# specter2 needs the adapters library, which pins transformers to 4.57.x and
# supports Python up to 3.12. Both constraints reach the whole environment, so
# they are written here rather than discovered on the GPU host: installing this
# extra downgrades transformers, and the bge arm and the reranker run happily on
# 4.57 too. The 3.12 ceiling is why requires-python stops below 3.13.
# See docs/kaggle.md.
specter = ["adapters~=1.3", "transformers~=4.57.6"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ragbench = "ragbench.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not network'"
markers = [
    "network: hits the NCBI API; deselected by default with -m 'not network'",
    "slow: downloads or runs a model",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
